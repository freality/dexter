version: '3'

tasks:
  build:ts:
    desc: Build the TypeScript SDK
    cmds:
      - pnpm install
      - pnpm build:ts
      - go run ./pkg/jsenv/sdk/gen
    sources:
      - packages/**/*.ts
    generates:
      - packages/**/dist/*

  build:go:
    desc: Build the Go CLI
    deps: [build:ts]
    cmds:
      - go build -o bin/dex ./cmd/dex
    sources:
      - cmd/**/*.go
      - pkg/**/*.go
      - adapters/**/*.go
      - pkg/jsenv/sdk/iac.js

  test:go:
    desc: Run Go tests with the 100% coverage gate
    cmds:
      - go test ./pkg/... ./cmd/dex/... ./adapters/docker/... -covermode=count -coverprofile=coverage.out
      - ./scripts/check-coverage.sh coverage.out

  build:
    desc: Build the entire Dexter system
    deps: [build:go] # build:go depends on build:ts, so the embedded SDK bundle is always current.

  clean:
    desc: Remove all built artifacts
    cmds:
      - rm -rf bin/
      - rm -rf packages/**/dist
      - rm -rf packages/**/node_modules